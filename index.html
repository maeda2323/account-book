<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人事管理ダッシュボード</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <h1>人事管理</h1>
        <nav class="menu">
          <button type="button" class="menu-item active" data-view="uploadView">データアップロード</button>
          <button type="button" class="menu-item" data-view="dashboardView">ダッシュボード</button>
        </nav>
      </aside>

      <main class="content">
        <header class="content-header">
          <h2 id="viewTitle">データアップロード</h2>
          <p>CSVファイルを読み込み、人事KPIを可視化します。</p>
        </header>

        <section id="uploadView" class="view active">
          <article class="panel">
            <h3>CSVアップロード</h3>
            <label for="fileInput">人事データ（CSV）</label>
            <input id="fileInput" type="file" accept=".csv,text/csv" />
            <p class="hint">
              推奨列名: 社員ID, 年齢, 部署, 性別, 入社日, 退職日, 勤続年数
              （列名は日本語・英語どちらでも可）
            </p>
            <button id="useSampleBtn" class="primary" type="button">サンプルデータを読み込む</button>
          </article>
        </section>

        <section id="dashboardView" class="view">
          <section id="status" class="status">データを読み込んでください。</section>

          <section id="summaryCards" class="cards"></section>

          <section class="grid">
            <article class="panel">
              <h3>年代別社員数</h3>
              <div id="ageTable"></div>
            </article>

            <article class="panel">
              <h3>勤続年数</h3>
              <div id="tenureSummary"></div>
              <div id="tenureTable"></div>
            </article>

            <article class="panel">
              <h3>部署別社員数</h3>
              <div id="departmentTable"></div>
            </article>

            <article class="panel">
              <h3>男女別社員数</h3>
              <div id="genderTable"></div>
            </article>

            <article class="panel full-width">
              <h3>入社人数・退職人数（年次）</h3>
              <div id="joinLeaveTable"></div>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
